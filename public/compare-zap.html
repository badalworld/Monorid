<!DOCTYPE html>
<html>
<body style='background:#030712; color:white; font-family:sans-serif; display:flex; gap:30px; padding:30px;'>
  <div>
    <h4>1. User Crop</h4>
    <img src='icon-exact-crop.png' style='width:160px; height:160px; image-rendering:pixelated;' />
  </div>
  <div>
    <h4>2. Lucide Zap (fill=none, stroke-width=2)</h4>
    <div style='width:160px; height:160px; background:#071624; border-radius:36px; border:2px solid rgba(6,182,212,0.5); display:flex; align-items:center; justify-content:center;'>
      <svg width='90' height='90' viewBox='0 0 24 24' fill='none' stroke='#22d3ee' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
        <polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2' />
      </svg>
    </div>
  </div>
  <div>
    <h4>3. Exact Pixel Traced Polygon</h4>
    <div style='width:160px; height:160px; background:#071624; border-radius:36px; border:2px solid rgba(6,182,212,0.5); display:flex; align-items:center; justify-content:center;'>
      <svg width='90' height='90' viewBox='10 4 22 22' fill='none' stroke='#22d3ee' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'>
        <polygon points='22.5 7.5, 14.5 16.5, 21.5 16.5, 20.5 23.5, 28.5 14.5, 21.5 14.5' />
      </svg>
    </div>
  </div>
</body>
</html>
